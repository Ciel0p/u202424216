<mat-button-toggle-group [value]="currentLang"
                         name="language"
                         [attr.aria-label]="'language-switcher.label' | translate">
  @for (language of languages; track language) {
    <mat-button-toggle [value]="language" (click)="useLanguage(language)">
      {{ language.toUpperCase() }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
