<footer class="footer" [attr.aria-label]="'footer.label' | translate">
  <p class="institutional">{{ 'footer.institutional' | translate }}</p>
  <p class="network-status" role="status">
    <span class="status-indicator" aria-hidden="true"></span>
    {{ 'footer.network-status' | translate }}
  </p>
  <p class="copyright">{{ 'footer.copyright' | translate: { year: currentYear } }}</p>
</footer>
